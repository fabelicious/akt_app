name: Apply price comparison enhancement
on:
  push:
    paths:
      - .github/workflows/apply-price-display.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.compare-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#475569}.legend-item{padding:5px 8px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:999px}'
          new = old + '.compare-prices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.price-card{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.price-card .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price-card .symbol{font-size:11px;color:#64748b}.price-card .actual{font-size:23px;font-weight:900;margin-top:5px}.price-card .change{font-size:12px;font-weight:800}.change.up{color:#15803d}.change.down{color:#b91c1c}'
          if old in s: s = s.replace(old,new,1)
          old = '@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.search-grid{grid-template-columns:1fr}.search-actions{justify-content:stretch}.search-actions .btn{width:100%}}'
          new = old[:-1] + '.compare-prices{grid-template-columns:1fr}}'
          if old in s: s = s.replace(old,new,1)
          old = '''<section class="compare-card">\n  <div class="compare-head">\n    <div><div class="compare-title">Kursvergleich – Aktien überlagert</div><div class="compare-sub">Alle ausgewählten Titel werden auf den Startwert 100 normiert. So ist die relative Entwicklung direkt vergleichbar.</div></div>\n    <div class="compare-legend" id="compareLegend"></div>\n  </div>\n  <div class="chart"><canvas id="compareChart"></canvas></div>\n</section>'''
          new = '''<section class="compare-card">\n  <div class="compare-head">\n    <div><div class="compare-title">Kursvergleich – Aktien überlagert</div><div class="compare-sub">Der Chart zeigt die relative Entwicklung ab Startwert 100. Darüber wird zusätzlich der tatsächliche aktuelle Kurs je Aktie angezeigt.</div></div>\n    <div class="compare-legend" id="compareLegend"></div>\n  </div>\n  <div class="compare-prices" id="comparePrices"></div>\n  <div class="chart"><canvas id="compareChart"></canvas></div>\n</section>'''
          if old in s: s = s.replace(old,new,1)
          old = "return{name:name||m.longName||m.shortName||m.displayName||s,symbol:s,data:p.data}}catch(e){}}return null}"
          new = "return{name:name||m.longName||m.shortName||m.displayName||s,symbol:s,data:p.data,meta:m}}catch(e){}}return null}"
          if old in s: s = s.replace(old,new,1)
          old = 'function renderCompare(){\n const datasets=[];'
          new = "function currency(s){return s.meta?.currency||''}\nfunction actualPrice(s){const m=s.meta||{};return Number.isFinite(m.regularMarketPrice)?m.regularMarketPrice:s.data.at(-1).c}\n\nfunction renderCompare(){\n const datasets=[];"
          if old in s: s = s.replace(old,new,1)
          old = " $('compareLegend').innerHTML=stocks.map(s=>'<span class=\"legend-item\">'+s.name+'</span>').join('');\n}"
          new = " $('compareLegend').innerHTML=stocks.map(s=>'<span class=\"legend-item\">'+s.name+'</span>').join('');\n $('comparePrices').innerHTML=stocks.map(s=>{const last=actualPrice(s),prev=s.data.at(-2)?.c??last,chg=(last/prev-1)*100;return '<div class=\"price-card\"><div class=\"name\">'+s.name+'</div><div class=\"symbol\">'+s.symbol+'</div><div class=\"actual\">'+fmt(last)+' '+currency(s)+'</div><div class=\"change '+(chg>=0?'up':'down')+'\">'+(chg>=0?'+':'')+chg.toFixed(2)+' % seit letztem Schluss</div></div>'}).join('');\n}"
          if old in s: s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show actual prices in stock comparison"
          git push
