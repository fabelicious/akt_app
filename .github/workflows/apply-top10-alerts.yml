name: Apply Top10 and alert enhancements

on:
  push:
    paths:
      - .github/workflows/apply-top10-alerts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          .alert-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;padding:12px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:12px}.alert-toolbar-title{font-weight:850}.alert-toolbar-sub{font-size:11px;color:#64748b;margin-top:2px}.alert-toolbar-actions{display:flex;gap:7px;flex-wrap:wrap}.alert-btn{padding:8px 11px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;font-size:11px;font-weight:800;cursor:pointer}.alert-btn.primary{background:#111827;color:#fff;border-color:#111827}.watch-btn{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:7px 9px;border-radius:8px;border:1px solid #475569;background:#273449;color:#e2e8f0;font-size:10px;font-weight:900;cursor:pointer}.watch-btn.marked{background:#0f766e;color:#ccfbf1;border-color:#14b8a6}.top10-item .watch-btn{width:100%;justify-content:center}.watch-list{display:flex;flex-direction:column;gap:7px;margin-top:9px}.watch-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px}.watch-main{min-width:0}.watch-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.watch-meta{font-size:10px;color:#64748b}.watch-state{font-size:10px;font-weight:900}.watch-state.buy{color:#15803d}.watch-state.no{color:#b91c1c}.watch-state.watch{color:#a16207}.alert-modal{position:fixed;inset:0;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:10000}.alert-modal.show{display:flex}.alert-dialog{width:min(560px,100%);background:#fff;border-radius:16px;padding:18px;box-shadow:0 25px 70px rgba(0,0,0,.28)}.alert-dialog h3{margin:0 0 5px}.alert-dialog .muted{font-size:12px;color:#64748b}.alert-form{display:grid;gap:10px;margin-top:14px}.alert-form label{font-size:11px;font-weight:800;color:#475569}.alert-form input[type=email],.alert-form input[type=text]{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px}.alert-checks{display:flex;gap:14px;flex-wrap:wrap}.alert-checks label{font-weight:700}.alert-dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.mail-config{margin-top:12px;padding:11px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;font-size:11px;color:#475569}.mail-config strong{color:#172033}.alert-status{margin-top:9px;font-size:11px;color:#475569;min-height:16px}.alert-warning{margin-top:9px;padding:9px;background:#fff7ed;color:#9a3412;border-radius:8px;font-size:11px}.top10-subtitle strong{color:#f8fafc}
          @media(max-width:700px){.alert-toolbar{align-items:stretch;flex-direction:column}.alert-toolbar-actions{width:100%}.alert-toolbar-actions .alert-btn{flex:1}.watch-row{align-items:flex-start;flex-direction:column}}
          '''
          css = '\n'.join(x.strip() for x in css.splitlines())
          if '.alert-toolbar{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          s = s.replace('Tages-Scan · nur Aktien mit mindestens 90/100', 'Tages-Scan · ohne WKN-Eingabe · nur Aktien mit mindestens 95/100', 1)
          s = s.replace('KAUFEN · 90+ erreicht', 'KAUFEN · 95+ erreicht', 1)

          toolbar = r'''
          <section class="alert-toolbar" id="alertToolbar">
            <div><div class="alert-toolbar-title">🔔 Beobachtete Titel & E-Mail-Alarme</div><div class="alert-toolbar-sub">Titel markieren, eigene E-Mail-Adresse hinterlegen und bei Wechsel zu KAUFEN bzw. NICHT KAUFEN benachrichtigen.</div></div>
            <div class="alert-toolbar-actions"><button type="button" class="alert-btn" id="mailSettingsBtn">✉️ Mail konfigurieren</button><button type="button" class="alert-btn primary" id="watchListBtn">🔔 Markierte Titel</button></div>
          </section>
          <section class="card" id="watchListPanel" style="display:none;margin-top:9px"><b>Markierte Titel</b><div id="watchList" class="watch-list"></div></section>
          '''
          if 'id="alertToolbar"' not in s:
              s = s.replace('</details>\n\n<div id="app"', '</details>\n' + toolbar + '\n<div id="app"', 1)

          modal = r'''
          <div class="alert-modal" id="markModal" aria-hidden="true"><div class="alert-dialog">
            <h3 id="markModalTitle">Titel markieren</h3><div class="muted" id="markModalMeta"></div>
            <form class="alert-form" id="markForm">
              <div><label for="markEmail">Empfänger-E-Mail</label><input id="markEmail" type="email" required placeholder="name@beispiel.at"></div>
              <div class="alert-checks"><label><input id="markBuy" type="checkbox" checked> KAUFEN-Mail</label><label><input id="markSell" type="checkbox" checked> NICHT KAUFEN-Mail</label></div>
              <div class="alert-warning">Die automatische Prüfung läuft im Browser. E-Mails werden versendet, solange diese Anwendung geöffnet ist. Für den Versand wird EmailJS verwendet; die Zugangsdaten werden nur lokal im Browser gespeichert.</div>
              <div class="alert-dialog-actions"><button type="button" class="alert-btn" id="markCancel">Abbrechen</button><button type="button" class="alert-btn" id="markRemove">Markierung entfernen</button><button class="alert-btn primary" type="submit">Markieren & speichern</button></div>
            </form>
          </div></div>
          <div class="alert-modal" id="mailModal" aria-hidden="true"><div class="alert-dialog">
            <h3>✉️ E-Mail-Versand konfigurieren</h3><div class="muted">Kostenloser Versand über EmailJS. Es werden nur die öffentliche Client-Konfiguration und deine Markierungen lokal gespeichert.</div>
            <form class="alert-form" id="mailForm">
              <div><label for="mailPublicKey">EmailJS Public Key</label><input id="mailPublicKey" type="text" autocomplete="off" placeholder="public_xxxxx"></div>
              <div><label for="mailServiceId">Service ID</label><input id="mailServiceId" type="text" autocomplete="off" placeholder="service_xxxxx"></div>
              <div><label for="mailTemplateId">Template ID</label><input id="mailTemplateId" type="text" autocomplete="off" placeholder="template_xxxxx"></div>
              <div class="muted">Das Template sollte mindestens die Variablen <strong>{{to_email}}</strong>, <strong>{{subject}}</strong>, <strong>{{message}}</strong>, <strong>{{symbol}}</strong> und <strong>{{score}}</strong> unterstützen.</div>
              <div class="alert-status" id="mailStatus"></div>
              <div class="alert-dialog-actions"><button type="button" class="alert-btn" id="mailCancel">Abbrechen</button><button type="button" class="alert-btn" id="mailTest">Testmail senden</button><button class="alert-btn primary" type="submit">Speichern</button></div>
            </form>
          </div></div>
          '''
          if 'id="markModal"' not in s:
              s = s.replace('</body>', modal + '\n</body>', 1)

          sdk = '<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>\n'
          if '@emailjs/browser@4' not in s:
              s = s.replace('</head>', sdk + '</head>', 1)

          js = r'''
          <script>
          (()=>{
            const WATCH_KEY='aktpro_watchlist_v1', MAIL_KEY='aktpro_emailjs_v1';
            const readWatch=()=>{try{return JSON.parse(localStorage.getItem(WATCH_KEY)||'{}')}catch(e){return {}}};
            const writeWatch=x=>localStorage.setItem(WATCH_KEY,JSON.stringify(x));
            const readMail=()=>{try{return JSON.parse(localStorage.getItem(MAIL_KEY)||'{}')}catch(e){return {}}};
            const writeMail=x=>localStorage.setItem(MAIL_KEY,JSON.stringify(x));
            let modalKey=null, modalMeta=null;
            const el=id=>document.getElementById(id);
            function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
            function normalizeRec(score){return score>=68?'KAUFEN':score<=42?'NICHT KAUFEN':'BEOBACHTEN'}
            function currentScoreFromCard(card){const m=card.querySelector('.top10-score')?.textContent.match(/([0-9]+)\s*\/\s*100/);return m?Number(m[1]):null}
            function decorateTop10(){
              const grid=el('top10Grid'); if(!grid)return;
              grid.querySelectorAll('.top10-item').forEach(card=>{
                const score=currentScoreFromCard(card);
                if(score!==null && score<95){card.remove();return}
                const symbol=card.querySelector('.top10-symbol')?.textContent.trim()||'';
                if(!symbol)return;
                card.dataset.watchSymbol=symbol;
                if(!card.querySelector('.watch-btn')){
                  const b=document.createElement('button'); b.type='button'; b.className='watch-btn'; b.textContent='🔔 Markieren';
                  b.addEventListener('click',e=>{e.stopPropagation();openMark(symbol,card.querySelector('.top10-name')?.textContent.trim()||symbol,symbol,score||0)});
                  card.appendChild(b);
                }
                syncButton(card.querySelector('.watch-btn'),symbol);
              });
              if(!grid.querySelector('.top10-item') && !grid.querySelector('.top10-loading') && !grid.querySelector('.top10-error')) grid.innerHTML='<div class="top10-empty">Heute wurden keine Titel mit mindestens 95/100 gefunden.</div>';
            }
            function decorateIndividuals(){
              document.querySelectorAll('#individuals .stock-group').forEach(group=>{
                const symbol=group.querySelector('.summary-symbol')?.textContent.trim()||'';
                const name=group.querySelector('.summary-name')?.textContent.trim()||symbol;
                const scoreText=group.querySelector('.summary-result')?.textContent||'';
                const score=Number(scoreText.match(/([0-9]+)\s*\/\s*100/)?.[1]||0);
                if(!symbol||group.querySelector('.watch-btn'))return;
                const b=document.createElement('button');b.type='button';b.className='watch-btn';b.textContent='🔔 Markieren';
                b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openMark(symbol,name,symbol,score)});
                group.querySelector('summary')?.appendChild(b);syncButton(b,symbol);
              });
            }
            function syncButton(btn,key){if(!btn)return;const w=readWatch();const on=!!w[key];btn.classList.toggle('marked',on);btn.textContent=on?'🔔 Markiert':'🔔 Markieren'}
            function refreshButtons(){document.querySelectorAll('.watch-btn').forEach(b=>syncButton(b,b.closest('[data-watch-symbol]')?.dataset.watchSymbol||b.closest('.stock-group')?.querySelector('.summary-symbol')?.textContent.trim()))}
            function openMark(key,name,symbol,score){
              modalKey=key;modalMeta={name,symbol,score};const w=readWatch()[key]||{};
              el('markModalTitle').textContent=(w?'Markierung bearbeiten: ':'Titel markieren: ')+name;el('markModalMeta').textContent=symbol+' · aktueller Score '+(score||'–')+'/100';el('markEmail').value=w.email||'';el('markBuy').checked=w.buy!==false;el('markSell').checked=w.sell!==false;el('markRemove').style.display=w?'inline-flex':'none';el('markModal').classList.add('show');el('markEmail').focus();
            }
            function closeModal(id){el(id)?.classList.remove('show')}
            function renderWatchList(){
              const panel=el('watchListPanel'),box=el('watchList'),w=readWatch(),keys=Object.keys(w);
              if(!keys.length){panel.style.display='none';box.innerHTML='';return}
              panel.style.display='block';box.innerHTML=keys.map(k=>{const x=w[k];return '<div class="watch-row"><div class="watch-main"><div class="watch-name">'+esc(x.name||k)+'</div><div class="watch-meta">'+esc(k)+' · '+esc(x.email||'')+'</div></div><div class="watch-state '+(x.lastRec==='KAUFEN'?'buy':x.lastRec==='NICHT KAUFEN'?'no':'watch')+'">'+esc(x.lastRec||'noch nicht geprüft')+'</div></div>'}).join('');
            }
            function mailReady(){const c=readMail();return !!(c.publicKey&&c.serviceId&&c.templateId&&window.emailjs)}
            function initMail(){const c=readMail();el('mailPublicKey').value=c.publicKey||'';el('mailServiceId').value=c.serviceId||'';el('mailTemplateId').value=c.templateId||'';if(c.publicKey&&window.emailjs){try{emailjs.init({publicKey:c.publicKey})}catch(e){}}}
            async function sendAlert(item,rec,score,price){
              if(!mailReady())return {ok:false,reason:'E-Mail-Versand ist noch nicht konfiguriert.'};
              const c=readMail();try{emailjs.init({publicKey:c.publicKey});await emailjs.send(c.serviceId,c.templateId,{to_email:item.email,subject:'AKT-Pro Alarm: '+rec+' – '+item.symbol,message:'AKT-Pro meldet '+rec+' für '+item.name+' ('+item.symbol+'). Score: '+Math.round(score)+'/100. Kurs: '+Number(price).toLocaleString('de-DE',{minimumFractionDigits:2}),symbol:item.symbol,score:Math.round(score),price:Number(price).toFixed(2),recommendation:rec,name:item.name});return {ok:true}}catch(e){return {ok:false,reason:e?.text||e?.message||'E-Mail konnte nicht gesendet werden.'}}
            }
            async function checkMarkedAlerts(){
              const w=readWatch(),keys=Object.keys(w);if(!keys.length)return;
              for(const key of keys){
                const item=w[key];try{const p=await chartData(item.symbol),z=analyse(p.data),rec=recFor(z.sc),price=z.c.at(-1),previous=item.lastRec;if(!item.lastRec){item.lastRec=rec;continue}if(rec!==previous&&(rec==='KAUFEN'&&item.buy!==false||rec==='NICHT KAUFEN'&&item.sell!==false)){const result=await sendAlert(item,rec,z.sc,price);item.lastAlert=result.ok?new Date().toISOString():item.lastAlert;item.lastError=result.ok?'':result.reason||''}item.lastRec=rec;item.lastScore=Math.round(z.sc);item.lastPrice=price}catch(e){item.lastError=e?.message||'Prüfung fehlgeschlagen'} }
              writeWatch(w);renderWatchList();
            }
            el('markForm')?.addEventListener('submit',e=>{e.preventDefault();if(!modalKey)return;const email=el('markEmail').value.trim();if(!email)return;const w=readWatch();const existing=w[modalKey]||{};w[modalKey]={...existing,key:modalKey,name:modalMeta.name,symbol:modalMeta.symbol,email,buy:el('markBuy').checked,sell:el('markSell').checked,lastRec:existing.lastRec||normalizeRec(Number(modalMeta.score)||0),createdAt:existing.createdAt||new Date().toISOString()};writeWatch(w);closeModal('markModal');renderWatchList();refreshButtons()});
            el('markRemove')?.addEventListener('click',()=>{if(!modalKey)return;const w=readWatch();delete w[modalKey];writeWatch(w);closeModal('markModal');renderWatchList();refreshButtons()});
            el('markCancel')?.addEventListener('click',()=>closeModal('markModal'));
            el('mailSettingsBtn')?.addEventListener('click',()=>{initMail();el('mailModal').classList.add('show');el('mailStatus').textContent=''});
            el('mailCancel')?.addEventListener('click',()=>closeModal('mailModal'));
            el('mailForm')?.addEventListener('submit',e=>{e.preventDefault();const c={publicKey:el('mailPublicKey').value.trim(),serviceId:el('mailServiceId').value.trim(),templateId:el('mailTemplateId').value.trim()};writeMail(c);initMail();el('mailStatus').textContent='Mail-Konfiguration gespeichert.'});
            el('mailTest')?.addEventListener('click',async()=>{const c={publicKey:el('mailPublicKey').value.trim(),serviceId:el('mailServiceId').value.trim(),templateId:el('mailTemplateId').value.trim()};const recipient=Object.values(readWatch())[0]?.email||prompt('An welche E-Mail-Adresse soll die Testmail gehen?','');if(!recipient){el('mailStatus').textContent='Keine Empfängeradresse vorhanden.';return}writeMail(c);if(!mailReady()){el('mailStatus').textContent='Bitte Public Key, Service ID und Template ID vollständig eintragen.';return}el('mailStatus').textContent='Testmail wird gesendet …';const r=await sendAlert({email:recipient,name:'AKT-Pro Test',symbol:'TEST'},'TEST',100,0);el('mailStatus').textContent=r.ok?'Testmail wurde gesendet.':'Fehler: '+r.reason});
            el('watchListBtn')?.addEventListener('click',()=>{renderWatchList();const panel=el('watchListPanel');panel.style.display=panel.style.display==='none'?'block':'none'});
            const observer=new MutationObserver(()=>{decorateTop10();decorateIndividuals();renderWatchList();refreshButtons()});
            observer.observe(el('top10Grid'),{childList:true,subtree:true});observer.observe(el('individuals'),{childList:true,subtree:true});
            decorateTop10();decorateIndividuals();renderWatchList();initMail();
            setTimeout(checkMarkedAlerts,2500);setInterval(checkMarkedAlerts,15*60*1000);
          })();
          </script>
          '''
          js = '\n'.join(x.strip() for x in js.splitlines())
          if 'aktpro_watchlist_v1' not in s:
              s = s.replace('</body>', js + '\n</body>', 1)

          p.write_text(s,encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add 95 score Top10 and email alerts"
          git push
