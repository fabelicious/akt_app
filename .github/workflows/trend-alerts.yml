name: Trendwende Push Alerts

# The actual hourly watchlist scan runs in the Cloudflare Durable Object.
# This GitHub workflow must not scan the complete global universe because
# GitHub Actions has no access to each user's private/local watchlist.
# Keeping the legacy workflow manual prevents duplicate pushes and failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Background alert service status
        run: |
          echo "Trendwende Push Alerts: OK"
          echo "Hourly watchlist scanning is handled by the Cloudflare background worker."
          echo "Only titles explicitly synchronized from the user's watchlist are scanned."
