name: Trendwende Push Alerts

on:
  schedule:
    - cron: '15 8,10,12,14,16,18,20 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'trend-alert-state.json'

permissions:
  contents: write

concurrency:
  group: trend-alerts
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan trend universe and publish changed signals
        run: python trend-alert-scan.py

      - name: Commit updated signal state
        run: |
          if git diff --quiet -- trend-alert-state.json; then
            echo 'No signal-state changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trend-alert-state.json
          git commit -m 'Update trend alert state [skip pages]'
          git push
