name: Deploy AKT App TEST Worker

on:
  push:
    branches: [development]
    paths:
      - 'index.html'
      - 'app.js'
      - 'score-model.js'
      - 'score-transparency-runtime.js'
      - 'final-fixes.js'
      - 'test-worker/**'
      - '.github/workflows/deploy-test-manual.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout DEVELOPMENT
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify TEST bundle
        run: |
          set -e
          test -f index.html
          test -f app.js
          test -f test-worker/worker.js
          test -f test-worker/wrangler.jsonc
          grep -q "AKT-Pro by fab" index.html
          echo "TEST commit: $(git rev-parse HEAD)"

      - name: Validate Wrangler config
        working-directory: test-worker
        run: wrangler check --config wrangler.jsonc

      - name: Deploy isolated TEST Worker
        working-directory: test-worker
        run: wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify TEST status endpoint
        run: |
          set -e
          URL="https://akt-app-test.sp-am.workers.dev/__test_status"
          curl -fsSL --retry 5 --connect-timeout 10 --max-time 20 "$URL" -D /tmp/headers -o /tmp/body
          grep -qi 'X-AKT-TEST: xetra-v7' /tmp/headers
          grep -q '"environment":"TEST"' /tmp/body
          grep -q '"runtime":"xetra-v7"' /tmp/body
          echo "TEST WORKER IS LIVE"

      - name: Verify TEST application
        run: |
          set -e
          URL="https://akt-app-test.sp-am.workers.dev/"
          curl -fsSL --retry 5 --connect-timeout 10 --max-time 20 "$URL" -D /tmp/app_headers -o /tmp/app_body
          grep -qi 'X-AKT-TEST: xetra-v7' /tmp/app_headers
          grep -q 'AKT-Pro by fab' /tmp/app_body
          echo "TEST APPLICATION IS LIVE"
