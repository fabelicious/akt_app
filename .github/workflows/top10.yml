name: Refresh Top 10

on:
  schedule:
    - cron: '15 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top10-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh Top 10 cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('top10.json')
          try:
              data=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              data={'items':[]}
          data['generatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          data.setdefault('items',[])
          p.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY

      - name: Commit only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add top10.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh top 10 cache'
          git push
