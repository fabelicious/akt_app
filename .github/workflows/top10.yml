name: Refresh Top 10
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_top10.py'
      - 'scripts/refresh_country_top10.py'
      - 'top10-score-sync.js'
      - '.github/workflows/top10.yml'
permissions:
  contents: write
concurrency:
  group: top10-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh global and country Top 10
        run: python scripts/refresh_country_top10.py
      - name: Commit Top 10 data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add top10.json country-top10.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh global and country top 10 scores'
          git push origin HEAD:main
