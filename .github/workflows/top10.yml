name: Refresh Top 10
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_top10.py'
      - '.github/workflows/top10.yml'
permissions:
  contents: write
concurrency:
  group: top10-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh Top 10 from free Yahoo Finance chart data
        run: python scripts/refresh_top10.py
      - name: Commit only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add top10.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh global top 10 scores'
          git push
