name: Fix Top10 threshold

on:
  push:
    paths:
      - .github/workflows/fix-top10-threshold.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Top10 threshold to 95
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(z.sc>=90)out.push(s)"
          new="if(z.sc>=95)out.push(s)"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Set Top10 score threshold to 95"
          git push
