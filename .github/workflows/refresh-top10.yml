name: Refresh fast Top 10 cache

# Free cache refresh: the browser never scans dozens of stocks on page load.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - .github/workflows/refresh-top10.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fast Top 10 cache
        shell: python
        run: |
          from pathlib import Path
          import json, math, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          symbols = ['NVDA','MSFT','AAPL','AMZN','GOOGL','META','AVGO','AMD','MU','TSM','ASML','SAP','ORCL','NFLX','PLTR','TSLA','QCOM','CSCO','JPM','V','MA','COST','LLY','NVO','CRM','ADBE','PANW','CRWD','ANET','GE','CAT','SHOP','UBER']

          def avg(a): return sum(a) / len(a) if a else 0
          def rsi(a):
              if len(a) < 15: return 50
              g=l=0
              for i in range(len(a)-14,len(a)):
                  d=a[i]-a[i-1]; g+=max(d,0); l+=max(-d,0)
              return 100-100/(1+g/l) if l else 100
          def score(close):
              n=close[-1]; a20=avg(close[-20:]); a50=avg(close[-50:]); a200=avg(close[-200:]); rr=rsi(close)
              s=50+(8 if n>a20 else -8)+(10 if n>a50 else -10)+(18 if n>a200 else -18)+(8 if rr<30 else -8 if rr>70 else 5)
              return max(0,min(100,s)),n,rr
          def fetch(sym):
              try:
                  url='https://query1.finance.yahoo.com/v8/finance/chart/'+urllib.parse.quote(sym)+'?range=1y&interval=1d&events=history'
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=8) as r: z=json.load(r).get('chart',{}).get('result',[None])[0]
                  if not z:return None
                  close=[x for x in z.get('indicators',{}).get('quote',[{}])[0].get('close',[]) if isinstance(x,(int,float)) and math.isfinite(x)]
                  if len(close)<200:return None
                  s,n,rr=score(close); meta=z.get('meta',{})
                  prev=close[-2] if len(close)>1 else n
                  return {'name':meta.get('longName') or meta.get('shortName') or sym,'symbol':sym,'score':round(s,2),'price':n,'change':round((n/prev-1)*100,2),'rsi':round(rr,1)}
              except Exception:return None
          out=[]
          with ThreadPoolExecutor(max_workers=8) as ex:
              for f in as_completed([ex.submit(fetch,s) for s in symbols]):
                  x=f.result()
                  if x and x['score']>=90: out.append(x)
          out.sort(key=lambda x:(-x['score'],x['symbol']))
          Path('top10.json').write_text(json.dumps({'generatedAt':datetime.now(timezone.utc).isoformat(),'criteria':'>=90/100','items':out[:10]},ensure_ascii=False,separators=(',',':')),encoding='utf-8')

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top10.json
          git diff --cached --quiet || git commit -m "Refresh Top 10 cache at 90 score threshold"
          git push
