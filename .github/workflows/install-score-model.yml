name: Install validated score model
on:
  push:
    paths:
      - 'score-model.js'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load score model before application code
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./score-model.js?v=1"></script>'
          if 'src="./score-model.js' not in s:
              marker='<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>'
              if marker not in s:
                  raise SystemExit('Chart.js marker not found')
              s=s.replace(marker,marker+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit index change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load validated score model'
          git push
