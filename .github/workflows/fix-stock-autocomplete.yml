name: Fix stock autocomplete
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch autocomplete
        shell: python
        run: |
          from pathlib import Path
          p=Path('enhancements.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('const local=')
          end=s.index('function addDescriptions',start)
          replacement=r'''const local=[['a11099','Arista Networks, Inc.','ANET','A11099'],['arista','Arista Networks, Inc.','ANET','A11099'],['anet','Arista Networks, Inc.','ANET','A11099'],['amazon','Amazon.com, Inc.','AMZN','906866'],['ama','Amazon.com, Inc.','AMZN','906866'],['nvidia','NVIDIA Corporation','NVDA','918422'],['nvda','NVIDIA Corporation','NVDA','918422']];
const detailCache=new Map(),requestCache=new Map(),suggestCache=new Map();
function suggestions(q){q=q.toLowerCase();return local.filter(x=>x[0].startsWith(q)||x[1].toLowerCase().includes(q)||x[2].toLowerCase().startsWith(q))}
function addSuggestionStyle(){if(document.getElementById('stock-suggestion-style'))return;const st=document.createElement('style');st.id='stock-suggestion-style';st.textContent='.stock-suggestions{position:absolute;z-index:10000;left:0;right:0;top:100%;display:none;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.18);overflow:auto;max-height:320px;margin-top:4px}.stock-suggestion{display:flex!important;width:100%;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:0;border-bottom:1px solid #eef2f7;background:#fff;color:#172033;text-align:left;cursor:pointer}.stock-suggestion:hover,.stock-suggestion:focus{background:#f1f5f9}.stock-suggestion b{font-size:14px}.stock-suggestion span{font-size:11px;color:#64748b}';document.head.appendChild(st)}
async function remoteSuggestions(q){q=q.trim();if(q.length<2)return[];const key=q.toLowerCase();if(suggestCache.has(key))return suggestCache.get(key);try{const rows=await yahooSearch(q);const out=[],seen=new Set();for(const x of rows){if(!x||x.quoteType!=='EQUITY'||!x.symbol||!x.shortname&&!x.longname)continue;const sym=String(x.symbol).toUpperCase();if(seen.has(sym))continue;seen.add(sym);out.push([key,x.longname||x.shortname||sym,sym,'']);if(out.length>=12)break}suggestCache.set(key,out);return out}catch(_){return[]}}
function mergeSuggestions(q,remote){const all=[...suggestions(q),...remote],seen=new Set(),out=[];for(const r of all){const k=(r[2]||r[3]||r[1]).toUpperCase();if(seen.has(k))continue;seen.add(k);out.push(r)}return out.slice(0,12)}
async function setupInput(id){const input=$(id);if(!input||input.dataset.enhanced)return;input.dataset.enhanced='1';input.placeholder='WKN, Ticker oder Aktienname, z. B. A11099 / Amazon';const p=input.parentElement;p.style.position='relative';addSuggestionStyle();const box=document.createElement('div');box.className='stock-suggestions';p.appendChild(box);let seq=0;const render=rows=>{box._rows=rows;box.innerHTML=rows.map((r,i)=>`<button type="button" class="stock-suggestion" data-i="${i}"><b>${esc(r[1])}</b><span>${esc(r[2])}${r[3]?' · WKN '+esc(r[3]):' · Aktie'}</span></button>`).join('');box.style.display=rows.length?'block':'none'};input.addEventListener('input',async()=>{const q=input.value.trim();input.dataset.selectedSymbol='';input.dataset.selectedWkn='';if(!q){box.style.display='none';return}const n=++seq;render(suggestions(q));if(q.length>=2){const remote=await remoteSuggestions(q);if(n===seq)render(mergeSuggestions(q,remote))}});box.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();const r=box._rows?.[+b.dataset.i];if(!r)return;input.value=r[3]||r[2];input.dataset.selectedSymbol=r[2]||'';input.dataset.selectedWkn=r[3]||'';input.dataset.selectedName=r[1]||'';box.style.display='none';input.dispatchEvent(new Event('change',{bubbles:true}))});input.addEventListener('keydown',e=>{if(e.key==='Escape')box.style.display='none'});input.addEventListener('blur',()=>setTimeout(()=>box.style.display='none',150))}
function setupAllStockInputs(){['wkn1','wkn2','wkn3'].forEach(id=>{try{setupInput(id)}catch(_){}})}
function installAutocompleteSubmitBridge(){const form=$('form');if(!form||form.dataset.autocompleteBridge)return;form.dataset.autocompleteBridge='1';form.addEventListener('submit',e=>{form.querySelectorAll('input[id^="wkn"]').forEach(input=>{if(input.dataset.selectedSymbol&&!input.dataset.selectedWkn)input.value=input.dataset.selectedSymbol})},true)}
'''
          s=s[:start]+replacement+s[end:]
          hook='\nsetTimeout(()=>{try{setupAllStockInputs();installAutocompleteSubmitBridge()}catch(_){ }},0);\n'
          if 'setupAllStockInputs();installAutocompleteSubmitBridge()' not in s:
            pos=s.rfind('\n})();')
            if pos<0: pos=len(s)
            s=s[:pos]+hook+s[pos:]
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-stock-autocomplete.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enhancements.js .github/workflows/fix-stock-autocomplete.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix stock autocomplete suggestions for all searchable stocks'
          git push
