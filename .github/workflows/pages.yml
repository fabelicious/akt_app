name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Refresh deterministic Top 10
        run: python scripts/refresh_top10.py
      - name: Validate static files
        run: |
          test -s index.html
          test -s enhancements.js
          test -s top10.json
          python -m json.tool top10.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('top10.json',encoding='utf-8'))
          assert len(d.get('items',[])) == 10, f"Expected 10 Top10 items, got {len(d.get('items',[]))}"
          assert len({x['symbol'] for x in d['items']}) == 10, 'Duplicate Top10 symbols'
          print('Top10 validated:', [(x['symbol'],x['score']) for x in d['items']])
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
