name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'trend-alert-state.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Refresh deterministic Top 10
        run: python scripts/refresh_top10.py

      - name: Validate Top 10
        run: |
          set -e
          test -s top10.json
          python -m json.tool top10.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('top10.json',encoding='utf-8'))
          items=d.get('items',[])
          assert 1 <= len(items) <= 10
          assert len({x['symbol'] for x in items})==len(items)
          assert all(isinstance(x.get('score'),(int,float)) for x in items)
          print('Top10:', [(x['symbol'],x['score']) for x in items])
          PY

      - name: Validate JavaScript syntax
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          for f in watchlist-worker/src/*.js; do node --check "$f"; done

      - name: Validate WKN map and critical symbols
        run: |
          python - <<'PY'
          import json
          d=json.load(open('wkn-map.json',encoding='utf-8'))
          items=d.get('items',{})
          assert items.get('918422',{}).get('symbol') == 'NVDA', 'NVDA WKN 918422 missing'
          assert items.get('870747',{}).get('symbol') == 'MSFT', 'MSFT WKN 870747 missing'
          assert items.get('865985',{}).get('symbol') == 'AAPL', 'AAPL WKN 865985 missing'
          print('WKN validation OK')
          PY

      - name: Verify central data architecture
        run: |
          set -e
          test -s market-data-provider.js
          grep -F '__AKT_MARKET_DATA_PROVIDER__' market-data-provider.js
          grep -F 'query1.finance.yahoo.com/v8/finance/chart' market-data-provider.js
          grep -F 'r.jina.ai' market-data-provider.js
          grep -F 'wkn-resolver.js' index.html

      - name: Publish central adapters before app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="./app.js?v=6"></script>'
          if marker not in s:
              raise SystemExit('app.js script marker not found')
          # Remove legacy runtime injection if a previous workflow left it behind.
          import re
          s=re.sub(r'<script src="\./runtime-final-fix-v2\.js\?v=[^"]+"></script>', '', s)
          s=re.sub(r'<script src="\./wkn-resolver\.js\?v=[^"]+"></script>', '', s)
          inject='<script src="./wkn-resolver.js?v=5"></script><script src="./market-data-provider.js?v=1"></script>'+marker
          s=s.replace(marker, inject, 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate published entrypoint order
        run: |
          set -e
          grep -F 'wkn-resolver.js?v=5' index.html
          grep -F 'market-data-provider.js?v=1' index.html
          test "$(grep -n 'wkn-resolver.js?v=5' index.html | cut -d: -f1)" -lt "$(grep -n 'app.js?v=6' index.html | cut -d: -f1)"
          test "$(grep -n 'market-data-provider.js?v=1' index.html | cut -d: -f1)" -lt "$(grep -n 'app.js?v=6' index.html | cut -d: -f1)"
          ! grep -q 'runtime-final-fix-v2.js' index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
