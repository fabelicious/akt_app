name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'trend-alert-state.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Refresh deterministic Top 10
        run: python scripts/refresh_top10.py
      - name: Validate Top 10
        run: |
          test -s top10.json
          python -m json.tool top10.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open('top10.json',encoding='utf-8'))
          items=d.get('items',[])
          assert 1 <= len(items) <= 10
          assert len({x['symbol'] for x in items})==len(items)
          assert all(isinstance(x.get('score'),(int,float)) for x in items)
          print('Top10:', [(x['symbol'],x['score']) for x in items])
          PY
      - name: Validate JavaScript syntax
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          for f in watchlist-worker/src/*.js; do node --check "$f"; done
      - name: Validate WKN map and critical symbols
        run: |
          python - <<'PY'
          import json
          d=json.load(open('wkn-map.json',encoding='utf-8'))
          assert '918422' in d.get('items',{}), 'NVDA WKN 918422 missing'
          assert d['items']['918422'].get('symbol') == 'NVDA', 'NVDA symbol mismatch'
          assert '870747' in d['items'], 'MSFT WKN missing'
          assert '865985' in d['items'], 'AAPL WKN missing'
          print('WKN validation OK')
          PY
      - name: Inject final market data and WKN adapter
        run: sed -i 's|<script src="./app.js?v=6"></script>|<script src="./runtime-final-fix-v2.js?v=2"></script><script src="./app.js?v=6"></script>|' index.html
      - name: Verify final adapter is published
        run: |
          grep -F 'runtime-final-fix-v2.js?v=2' index.html
          test -s runtime-final-fix-v2.js
          grep -F 'r.jina.ai' runtime-final-fix-v2.js
          grep -F 'Kursdaten für ' runtime-final-fix-v2.js
          grep -F 'WKN' runtime-final-fix-v2.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
