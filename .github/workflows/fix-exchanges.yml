name: Fix exchange selector

on:
  push:
    paths:
      - '.github/workflows/fix-exchanges.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exchange selector and add marketplaces
        shell: python
        run: |
          from pathlib import Path
          p = Path('enhancements.js')
          s = p.read_text(encoding='utf-8')

          old = "function findStockHit(key){const clean=String(key||'').replace(/^price-/,'');const arr=Array.isArray(window.stocks)?window.stocks:[];return arr.find(s=>{const sym=String(s?.symbol||s?.meta?.symbol||s?.data?.symbol||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();return sym===clean.toUpperCase()||String(s?.key||'')===clean})||null}"
          new = "function findStockHit(key){const clean=String(key||'').replace(/^price-/,'');const arr=Array.isArray(window.stocks)?window.stocks:(typeof stocks!=='undefined'&&Array.isArray(stocks)?stocks:[]);if(/^\\d+$/.test(clean)&&arr[Number(clean)])return arr[Number(clean)];return arr.find(s=>{const sym=String(s?.symbol||s?.meta?.symbol||s?.data?.symbol||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();return sym===clean.toUpperCase()||String(s?.key||'')===clean})||null}"
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace("['xetra','Xetra','.DE'],['frankfurt','Frankfurt','.F']", "['xetra','Xetra','.DE'],['frankfurt','Frankfurt','.F'],['munich','München','.MU'],['stuttgart','Stuttgart','.SG'],['hamburg','Hamburg','.HM'],['berlin','Berlin','.BE']", 1)
          s = s.replace("'.DE':'xetra','.F':'frankfurt'", "'.DE':'xetra','.F':'frankfurt','.MU':'munich','.SG':'stuttgart','.HM':'hamburg','.BE':'berlin'", 1)
          s = s.replace("\\.(DE|F|L|PA|AS|MI|MC|SW|VI|HK|T|TO|AX|ST|OL|CO)$", "\\.(DE|F|MU|SG|HM|BE|L|PA|AS|MI|MC|SW|VI|HK|T|TO|AX|ST|OL|CO)$", 1)
          s = s.replace("|id==='copenhagen')", "|id==='copenhagen')", 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enhancements.js
          git diff --cached --quiet || git commit -m 'Fix exchange selector and add German exchanges'
          git push
