name: Deploy watchlist background worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'watchlist-worker/**'
      - '.github/workflows/deploy-watchlist-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchlist-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Validate Wrangler configuration
        run: npx wrangler check

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
