name: Enable support/resistance order fix

on:
  push:
    branches: [main]
    paths:
      - 'support-resistance-order.js'

permissions:
  contents: write

jobs:
  add-script-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add script reference to index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./support-resistance-order.js?v=1"></script>'
          if tag not in s:
              marker = '<script src="./kgv-runtime.js?v=6"></script>'
              if marker not in s:
                  raise SystemExit('Insert marker not found')
              s = s.replace(marker, marker + '\n' + tag)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Place support and resistance before technical recommendation'
          git push
