<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AKT-Pro by fab v0.1</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:18px 15px}.hero{background:#111827;color:#fff;border-radius:18px;padding:22px}.hero h1{margin:0 0 5px}.hero p{color:#cbd5e1}.search-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.input-wrap{display:flex;flex-direction:column;gap:5px}.input-wrap label{font-size:11px;color:#94a3b8}.search input{width:100%;padding:12px;border-radius:9px;border:1px solid #475569;background:#1f2937;color:#fff;font-size:16px}.search-actions{display:flex;justify-content:flex-end;margin-top:8px}.btn{padding:11px 16px;border:0;border-radius:9px;background:#38bdf8;font-weight:800;cursor:pointer}.status{margin-top:10px;font-size:11px;color:#cbd5e1}.error{display:none;margin-top:9px;background:#fee2e2;color:#991b1b;padding:11px;border-radius:9px;font-size:12px}.top10-panel{margin-top:11px;background:#111827;color:#fff;border-radius:15px;padding:14px 17px}.top10-title{font-size:17px;font-weight:900}.top10-subtitle{font-size:10px;color:#94a3b8}.app-shell{margin-top:12px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.tabs{display:flex;gap:6px;margin-bottom:9px}.tab,.action-btn{padding:8px 11px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-weight:700;font-size:11px;cursor:pointer}.tab.active{background:#111827;color:#fff}.group-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.group-actions{display:flex;gap:6px}.individual-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.foot{font-size:11px;color:#94a3b8;margin-top:9px}@media(max-width:700px){.search-grid,.individual-grid{grid-template-columns:1fr}.search-actions .btn{width:100%}.group-controls{flex-direction:column;gap:7px;align-items:stretch}}</style></head><body><div class="wrap"><section class="hero"><h1>📈 AKT-Pro by fab v0.1</h1><p>Technische Aktienanalyse · sichere Fallback-Startvariante</p><form id="form"><div class="search-grid"><div class="input-wrap"><label>Aktie 1</label><input id="wkn1" placeholder="WKN, Ticker oder Name"></div><div class="input-wrap"><label>Aktie 2</label><input id="wkn2" placeholder="WKN, Ticker oder Name"></div><div class="input-wrap"><label>Aktie 3</label><input id="wkn3" placeholder="WKN, Ticker oder Name"></div></div><div class="search-actions"><button class="btn" id="analyzeBtn" type="submit">Analysieren</button></div></form><div id="status" class="status">Grundoberfläche bereit. Module werden geschützt nachgeladen.</div><div id="err" class="error"></div></section><section class="top10-panel"><div class="top10-title">🏆 Top 10 Kaufempfehlungen</div><div class="top10-subtitle">Wird nach dem stabilen Seitenstart aktiviert.</div></section><section id="app" class="app-shell"><div class="tabs"><button class="tab" data-d="30">1M</button><button class="tab" data-d="90">3M</button><button class="tab active" data-d="180">6M</button><button class="tab" data-d="365">1J</button><button class="tab" data-d="1825">5J</button></div><div class="group-controls"><b>Einzelanalysen</b><div class="group-actions"><button type="button" class="action-btn" id="openAll">Alle öffnen</button><button type="button" class="action-btn" id="closeAll">Alle schließen</button></div></div><div id="individuals" class="individual-grid"></div></section><div class="foot">Regelbasiertes technisches Modell, keine Anlageberatung.</div></div><script>(function(){const mods=['https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js','score-model.js?v=3','exchange-selector.js?v=3','wkn-timeout.js?v=3','app.js?v=6','compat-fixes.js?v=5','exchange-runtime.js?v=1','period-runtime.js?v=1','final-fixes.js?v=1','top10-score-sync.js?v=2','kgv-runtime.js?v=6','support-resistance-order.js?v=2','period-change-runtime.js?v=2','multi-detail-runtime.js?v=2','metal-runtime.js?v=2','watchlist-runtime.js?v=1','ui-runtime.js?v=2','historical-analysis-prototype-v2.js?v=1','trend-reversal-prototype.js?v=2','country-trend-top10-prototype-v3.js?v=1','watchlist-trend-alerts.js?v=1','trend-push-runtime.js?v=1'];const st=document.getElementById('status');function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.async=false;let done=false;const t=setTimeout(()=>{if(!done){done=true;s.remove();no()}},7000);s.onload=()=>{if(!done){done=true;clearTimeout(t);ok()}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);no()}};document.body.appendChild(s)})}async function boot(){for(let i=0;i<mods.length;i++){st.textContent='Modul '+(i+1)+'/'+mods.length+' wird geladen …';await load(mods[i]).catch(()=>console.warn('Modul nicht geladen:',mods[i]))}st.textContent='Anwendung bereit'}boot()})();</script></body></html>
